name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build --tag campus-helpdesk-api:${GITHUB_SHA} .

      - name: Scan container image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: campus-helpdesk-api:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag "campus-helpdesk-api:${GITHUB_SHA}" "${image_name}:${GITHUB_SHA}"
          docker push "${image_name}:${GITHUB_SHA}"

      - name: Update GitOps image reference
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          image_name="ghcr.io/${GITHUB_REPOSITORY,,}"
          sed -i "s|^  repository:.*|  repository: ${image_name}|" deploy/helm/helpdesk/values.yaml
          sed -i "s|^  tag:.*|  tag: \"${GITHUB_SHA}\"|" deploy/helm/helpdesk/values.yaml
          if git diff --quiet -- deploy/helm/helpdesk/values.yaml; then
            echo "GitOps image reference is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/helpdesk/values.yaml
          git commit -m "chore(gitops): deploy ${GITHUB_SHA}"
          git push
