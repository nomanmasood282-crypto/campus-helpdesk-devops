apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: helpdesk-dashboard
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: default
  source:
    repoURL: https://github.com/nomanmasood282-crypto/campus-helpdesk-devops.git
    targetRevision: main
    path: deploy/monitoring
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
