apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: grafana
    targetRevision: 8.15.0
    helm:
      valuesObject:
        image:
          tag: 11.6.1
        testFramework:
          enabled: false
        persistence:
          enabled: false
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 384Mi
        livenessProbe:
          initialDelaySeconds: 120
          timeoutSeconds: 10
          failureThreshold: 10
        readinessProbe:
          initialDelaySeconds: 30
          timeoutSeconds: 10
          failureThreshold: 10
        sidecar:
          dashboards:
            enabled: false
          datasources:
            enabled: false
        datasources:
          datasources.yaml:
            apiVersion: 1
            datasources:
              - name: Prometheus
                uid: prometheus
                type: prometheus
                access: proxy
                url: http://monitoring-prometheus-server.monitoring.svc.cluster.local
                isDefault: true
        dashboardProviders:
          dashboardproviders.yaml:
            apiVersion: 1
            providers:
              - name: default
                orgId: 1
                folder: ""
                type: file
                disableDeletion: false
                editable: true
                options:
                  path: /var/lib/grafana/dashboards/default
        dashboardsConfigMaps:
          default: helpdesk-api-dashboard
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
