apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: prometheus
    targetRevision: 29.45.1
    helm:
      valuesObject:
        alertmanager:
          enabled: false
        kube-state-metrics:
          enabled: false
        prometheus-node-exporter:
          enabled: false
        prometheus-pushgateway:
          enabled: false
        scrapeConfigs:
          prometheus:
            enabled: false
          kubernetes-api-servers:
            enabled: false
          kubernetes-nodes:
            enabled: false
          kubernetes-nodes-cadvisor:
            enabled: false
          kubernetes-service-endpoints:
            enabled: false
          kubernetes-service-endpoints-slow:
            enabled: false
          prometheus-pushgateway:
            enabled: false
          kubernetes-services:
            enabled: false
          kubernetes-pods:
            enabled: false
          kubernetes-pods-slow:
            enabled: false
        server:
          persistentVolume:
            enabled: false
          retention: 3d
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 384Mi
        extraScrapeConfigs: |
          - job_name: helpdesk-api
            metrics_path: /metrics
            static_configs:
              - targets:
                  - helpdesk.helpdesk.svc.cluster.local:80
                labels:
                  namespace: helpdesk
                  service: helpdesk
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
