replicaCount: 1

image:
  repository: campus-helpdesk-api
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  storageClassName: local-path
  accessMode: ReadWriteOnce
  size: 1Gi

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: false
    release: monitoring
    interval: 30s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
