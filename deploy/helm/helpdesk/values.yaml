replicaCount: 1

image:
  repository: ghcr.io/nomanmasood282-crypto/campus-helpdesk-devops
  pullPolicy: IfNotPresent
  tag: "64a06e9c1978e7c611cfbbcc3e937384eac08202"

service:
  type: ClusterIP
  port: 80

persistence:
  enabled: true
  storageClassName: local-path
  accessMode: ReadWriteOnce
  size: 1Gi

metrics:
  enabled: true
  path: /metrics
  serviceMonitor:
    enabled: false
    release: monitoring
    interval: 30s

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
