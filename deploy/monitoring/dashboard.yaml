apiVersion: v1
kind: ConfigMap
metadata:
  name: helpdesk-api-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  helpdesk-api.json: |
    {
      "id": null,
      "uid": "helpdesk-api",
      "title": "Campus Helpdesk API",
      "tags": ["helpdesk", "api"],
      "timezone": "browser",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "30s",
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "Request rate",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_requests_total{namespace=\"helpdesk\",service=\"helpdesk\"}[5m]))",
              "legendFormat": "requests / second",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 2,
          "title": "Mean request duration",
          "type": "timeseries",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "targets": [
            {
              "expr": "sum(rate(http_request_duration_seconds_sum{namespace=\"helpdesk\",service=\"helpdesk\"}[5m])) / clamp_min(sum(rate(http_request_duration_seconds_count{namespace=\"helpdesk\",service=\"helpdesk\"}[5m])), 1e-9)",
              "legendFormat": "seconds",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom"
            },
            "tooltip": {
              "mode": "single",
              "sort": "none"
            }
          }
        },
        {
          "id": 3,
          "title": "Total API requests",
          "type": "stat",
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "gridPos": {
            "h": 5,
            "w": 6,
            "x": 0,
            "y": 8
          },
          "targets": [
            {
              "expr": "sum(http_requests_total{namespace=\"helpdesk\",service=\"helpdesk\"})",
              "legendFormat": "requests",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": {
              "calcs": ["lastNotNull"],
              "fields": "",
              "values": false
            },
            "orientation": "auto",
            "textMode": "auto",
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto"
          }
        }
      ]
    }
